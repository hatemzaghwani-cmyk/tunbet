    <style>
      html,body{margin:0;background:#020408;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
      body{min-height:100vh;min-height:100dvh}
      img{content-visibility:auto}
      /* Loading screen — shown until React mounts */
      .mebet-boot{position:fixed;inset:0;background:#020408;display:flex;align-items:center;justify-content:center;z-index:9999}
      .mebet-boot-logo{
        width:60px;height:60px;border-radius:50%;
        border:2px solid #00D1FF;display:flex;align-items:center;justify-content:center;
        color:#00D1FF;font-family:system-ui;font-weight:900;font-size:28px;
        box-shadow:0 0 24px rgba(0,209,255,0.5);
        animation:mebetPulse 1.4s ease-in-out infinite;
      }
      @keyframes mebetPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:0.6}}
      /* Hide scrollbar */
      .scrollbar-hide{scrollbar-width:none;-ms-overflow-style:none}
      .scrollbar-hide::-webkit-scrollbar{display:none}
    </style>

  <body>
    <div id="root">
      <div class="mebet-boot" id="mebet-boot-screen">
        <div class="mebet-boot-logo">M</div>
      </div>
    </div>
    <script>
      // Kill stale service workers + cached responses from prior deploys
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});
      }
      if ('caches' in window) {
        caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove boot screen once React has rendered (root has children)
      var pollBoot = setInterval(function(){
        var root = document.getElementById('root');
        var boot = document.getElementById('mebet-boot-screen');
        if (root && root.children.length > 1 && boot) {
          boot.style.transition = 'opacity 0.25s';
          boot.style.opacity = '0';
          setTimeout(function(){ boot.remove(); }, 280);
          clearInterval(pollBoot);
        }
      }, 50);
      setTimeout(function(){ clearInterval(pollBoot); var b=document.getElementById('mebet-boot-screen'); if(b) b.remove(); }, 8000);

      // Self-ping every 4 minutes to keep site alive (warm odds-api cache via Sports tab visits)
      setInterval(function(){fetch(location.href,{mode:'no-cors'}).catch(function(){})},240000);
    </script>
  </body>
